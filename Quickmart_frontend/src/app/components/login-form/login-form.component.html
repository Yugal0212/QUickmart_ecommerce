<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col space-y-6">
  
  <div class="mb-4">
    <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Welcome back</h2>
    <p class="text-sm text-gray-500 mt-2">Please enter your details to sign in.</p>
  </div>

  <!-- Username or Email -->
  <div class="space-y-1">
    <label for="usernameOrEmail" class="block text-sm font-medium text-gray-700">Username or Email</label>
    <div class="relative rounded-xl shadow-sm border focus-within:border-green-500 focus-within:ring-1 focus-within:ring-green-500 transition-all duration-200" [ngClass]="{ 'border-red-300': f['usernameOrEmail'].invalid && (f['usernameOrEmail'].dirty || f['usernameOrEmail'].touched), 'border-gray-300': !(f['usernameOrEmail'].invalid && (f['usernameOrEmail'].dirty || f['usernameOrEmail'].touched)) }">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <i class="fas fa-user text-gray-400"></i>
      </div>
      <input id="usernameOrEmail" formControlName="usernameOrEmail" type="text" placeholder="Enter your username or email" class="block w-full pl-11 pr-10 py-3 sm:text-sm bg-transparent border-none focus:ring-0 rounded-xl" />
      <div *ngIf="f['usernameOrEmail'].invalid && (f['usernameOrEmail'].dirty || f['usernameOrEmail'].touched)" class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
        <i class="fas fa-exclamation-circle text-red-500"></i>
      </div>
    </div>
    <div *ngIf="f['usernameOrEmail'].invalid && (f['usernameOrEmail'].dirty || f['usernameOrEmail'].touched)" class="text-sm text-red-600 mt-1">
      Username or Email is required.
    </div>
  </div>

  <!-- Password -->
  <div class="space-y-1">
    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
    <div class="relative rounded-xl shadow-sm border focus-within:border-green-500 focus-within:ring-1 focus-within:ring-green-500 transition-all duration-200" [ngClass]="{ 'border-red-300': f['password'].invalid && (f['password'].dirty || f['password'].touched), 'border-gray-300': !(f['password'].invalid && (f['password'].dirty || f['password'].touched)) }">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <i class="fas fa-lock text-gray-400"></i>
      </div>
      <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••" class="block w-full pl-11 pr-12 py-3 sm:text-sm bg-transparent border-none focus:ring-0 rounded-xl" />
      <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-gray-400 hover:text-gray-600 focus:outline-none" (click)="togglePasswordVisibility()">
        <i class="fas" [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
      </button>
    </div>
    <div *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)" class="text-sm text-red-600 mt-1">
      Password is required (min 6 characters).
    </div>
  </div>

  <!-- Remember Me & Forgot Password -->
  <div class="flex items-center justify-between">
    <div class="flex items-center">
      <input id="terms" formControlName="terms" type="checkbox" class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded cursor-pointer" />
      <label for="terms" class="ml-2 block text-sm text-gray-900 cursor-pointer">
        Remember me
      </label>
    </div>
    <div class="text-sm">
      <a href="#" class="font-medium text-green-600 hover:text-green-500 hover:underline">Forgot password?</a>
    </div>
  </div>
  <div *ngIf="f['terms'].invalid && (f['terms'].dirty || f['terms'].touched)" class="text-sm text-red-600">
    You must agree to remember login.
  </div>

  <!-- Buttons -->
  <div class="flex flex-col space-y-4 pt-2">
    <button type="submit" [disabled]="loginForm.invalid || loading" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-70 disabled:cursor-not-allowed transition-all duration-300">
      <span *ngIf="!loading">Sign in</span>
      <i *ngIf="loading" class="fas fa-circle-notch fa-spin"></i>
    </button>
    
    <button type="button" class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-gray-300 rounded-xl shadow-sm bg-white text-sm font-bold text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all duration-300">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
      Sign in with Google
    </button>
  </div>

  <!-- Footer -->
  <p class="text-center text-sm text-gray-600 pt-4">
    Don't have an account? 
    <a routerLink="/login/sign-up" class="font-bold text-green-600 hover:text-green-500 hover:underline">Sign up for free</a>
  </p>
</form>
