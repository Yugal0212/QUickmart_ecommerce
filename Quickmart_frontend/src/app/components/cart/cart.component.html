<div class="container my-5">
  <h2 class="text-center mb-4">🛒 Your Shopping Cart</h2>
  <div *ngIf="isLoading">
    <!-- Skeleton Loader for Cart Items -->
    <div class="row">
      <div class="col-lg-8">
        <div id="cart-items">
          <div class="cart-item p-3 mb-3 d-flex align-items-center shimmer" *ngFor="let item of [].constructor(3)">
            <div class="skeleton-image shimmer"></div>
            <div class="cart-details ms-3">
              <div class="skeleton-text shimmer" style="width: 150px; height: 20px;"></div>
              <div class="skeleton-text shimmer" style="width: 100px; height: 16px; margin-top: 8px;"></div>
              <div class="quantity d-flex align-items-center">
                <div class="skeleton-text shimmer" style="width: 30px; height: 30px;"></div>
                <div class="skeleton-text shimmer" style="width: 30px; height: 20px; margin: 0 10px;"></div>
                <div class="skeleton-text shimmer" style="width: 30px; height: 30px;"></div>
              </div>
            </div>
            <div class="cart-price ms-auto text-center">
              <div class="skeleton-text shimmer" style="width: 80px; height: 20px;"></div>
              <div class="skeleton-text shimmer" style="width: 80px; height: 30px; margin-top: 8px;"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <!-- Skeleton Loader for Cart Summary -->
        <div class="cart-summary p-4 shimmer">
          <div class="skeleton-text shimmer" style="width: 100px; height: 24px;"></div>
          <div class="summary-item d-flex justify-content-between" *ngFor="let item of [].constructor(2)">
            <div class="skeleton-text shimmer" style="width: 100px; height: 16px;"></div>
            <div class="skeleton-text shimmer" style="width: 50px; height: 16px;"></div>
          </div>
          <hr>
          <div class="summary-total d-flex justify-content-between">
            <div class="skeleton-text shimmer" style="width: 80px; height: 20px;"></div>
            <div class="skeleton-text shimmer" style="width: 80px; height: 20px;"></div>
          </div>
          <div class="skeleton-text shimmer" style="width: 100%; height: 40px; margin-top: 16px;"></div>
          <div class="skeleton-text shimmer" style="width: 100%; height: 40px; margin-top: 8px;"></div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="!isLoading">
    <div *ngIf="cart.items.length === 0" class="alert alert-info text-center">
      Your cart is empty. <a routerLink="/home" class="alert-link">Start shopping!</a>
    </div>
    <div *ngIf="cart.items.length > 0">
      <div class="row">
        <div class="col-lg-8">
          <div id="cart-items">
            <div class="cart-item p-3 mb-3 d-flex align-items-center" *ngFor="let item of cart.items">
              <img [src]="item.images[0]" 
                   class="cart-img" 
                   alt="Product" 
                   style="width: 100px; height: auto;">
              <div class="cart-details ms-3">
                <h5>{{ item.name }}</h5>
                <p class="text-muted">Price: ${{ item.price }}</p>
                <div class="quantity d-flex align-items-center">
                  <button class="btn btn-sm btn-outline-secondary" (click)="updateQuantity(item.product, item.quantity - 1)">-</button>
                  <span class="px-3">{{ item.quantity }}</span>
                  <button class="btn btn-sm btn-outline-secondary" (click)="updateQuantity(item.product, item.quantity + 1)">+</button>
                </div>
              </div>
              <div class="cart-price ms-auto text-center">
                <h5>${{ item.totalPrice }}</h5>
                <button class="btn btn-danger btn-sm" (click)="confirmRemoveItem(item.product)">
                  <i class="fas fa-trash"></i> Remove
                </button>
              </div>
            </div>
          </div>
          <!-- Add More Items Button -->
          <div class="text-center mt-4">
            <button class="btn btn-outline-primary btn-lg" routerLink="/home">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-house-door me-2" viewBox="0 0 16 16">
                <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L8 1.707 2.854 6.854a.5.5 0 1 0-.708.708l6-6a.5.5 0 0 0 .708 0z"/>
              </svg>
              Add More Items
            </button>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="cart-summary p-4">
            <h4>Price Details</h4>
            <div class="summary-item d-flex justify-content-between" *ngFor="let item of cart.items">
              <p>{{ item.name }} (x{{ item.quantity }})</p>
              <p>${{ item.totalPrice }}</p>
            </div>
            <hr>
            <div class="summary-total d-flex justify-content-between">
              <h5>Total</h5>
              <h5>${{ cart.total }}</h5>
            </div>
            <button class="btn btn-primary w-100 mt-3" routerLink="/order">Proceed to Checkout</button>
            <button class="btn btn-outline-danger w-100 mt-2" (click)="confirmClearCart()">Clear Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
