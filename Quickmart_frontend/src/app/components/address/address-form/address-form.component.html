<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card address-card p-4">
        <h2 class="text-center text-primary mb-4">
            <i class="fas fa-map-marker-alt"></i> {{ isEditMode ? 'Edit Address' : 'Add New Address' }}

        </h2>

        <form [formGroup]="addressForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control input-field" formControlName="fullName" placeholder="Enter your full name" required>
                </div>
                <div *ngIf="addressForm.get('fullName')?.invalid && addressForm.get('fullName')?.touched" class="text-danger">
                    Full Name is required.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                    <input type="tel" class="form-control input-field" formControlName="phoneNumber" placeholder="Enter your phone number" required>
                </div>
                <div *ngIf="addressForm.get('phoneNumber')?.invalid && addressForm.get('phoneNumber')?.touched" class="text-danger">
                    Valid Phone Number is required.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Address Line 1</label>
                <input type="text" class="form-control input-field" formControlName="addressLine1" placeholder="House No, Street, Area" required>
                <div *ngIf="addressForm.get('addressLine1')?.invalid && addressForm.get('addressLine1')?.touched" class="text-danger">
                    Address Line 1 is required.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Address Line 2</label>
                <input type="text" class="form-control input-field" formControlName="addressLine2" placeholder="Apartment, Suite, Floor (Optional)">
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">City</label>
                    <input type="text" class="form-control input-field" formControlName="city" placeholder="Enter city" required>
                    <div *ngIf="addressForm.get('city')?.invalid && addressForm.get('city')?.touched" class="text-danger">
                        City is required.
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Country</label>
                    <input type="text" class="form-control input-field" formControlName="country" placeholder="Enter country" required>
                    <div *ngIf="addressForm.get('country')?.invalid && addressForm.get('country')?.touched" class="text-danger">
                        Country is required.
                    </div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">State</label>
                    <input type="text" class="form-control input-field" formControlName="state" placeholder="Enter state" required>
                    <div *ngIf="addressForm.get('state')?.invalid && addressForm.get('state')?.touched" class="text-danger">
                        State is required.
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Zip Code</label>
                <input type="text" class="form-control input-field" formControlName="zipCode" placeholder="Enter zip code" required>
                <div *ngIf="addressForm.get('zipCode')?.invalid && addressForm.get('zipCode')?.touched" class="text-danger">
                    Zip Code is required.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Landmark (Optional)</label>
                <input type="text" class="form-control input-field" formControlName="landmark" placeholder="Nearby famous place">
            </div>

            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary w-75 shadow-sm" [disabled]="addressForm.invalid">
                    {{ isEditMode ? 'Update Address' : 'Save Address' }}
                  </button>            </div>
        </form>
    </div>
</div>
