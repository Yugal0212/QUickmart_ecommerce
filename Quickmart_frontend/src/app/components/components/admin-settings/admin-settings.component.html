<div class="p-6 max-w-5xl mx-auto animate__animated animate__fadeIn">
  
  <div class="mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">System Settings</h1>
      <p class="text-gray-500 mt-1">Configure global platform toggles, commission rates, and core variables.</p>
    </div>
    
    <button (click)="saveSettings()" [disabled]="isSaving" 
            class="px-8 py-3 rounded-xl bg-gray-900 text-white font-bold hover:bg-gray-800 disabled:opacity-50 transition-all shadow-lg flex items-center">
      <i class="fas fa-save mr-2" *ngIf="!isSaving"></i>
      <i class="fas fa-spinner fa-spin mr-2" *ngIf="isSaving"></i>
      {{ isSaving ? 'Saving...' : 'Save Changes' }}
    </button>
  </div>

  <div class="space-y-8">
    
    <!-- General Store Settings -->
    <div class="bg-white/80 backdrop-blur-xl border border-gray-100 rounded-3xl p-8 shadow-sm hover:shadow-md transition-shadow">
      <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center">
        <i class="fas fa-store text-blue-500 mr-3"></i> General Details
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Platform Name</label>
          <input type="text" [(ngModel)]="settings.platformName"
                 class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition-colors">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Support Email</label>
          <input type="email" [(ngModel)]="settings.supportEmail"
                 class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition-colors">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Default Currency</label>
          <select [(ngModel)]="settings.currency"
                  class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition-colors">
            <option value="INR">INR (₹)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
            <option value="INR">INR (₹)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Financial Settings -->
    <div class="bg-white/80 backdrop-blur-xl border border-gray-100 rounded-3xl p-8 shadow-sm hover:shadow-md transition-shadow">
      <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center">
        <i class="fas fa-money-bill-wave text-green-500 mr-3"></i> Financial Configurations
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Platform Commission Rate (%)</label>
          <input type="number" [(ngModel)]="settings.commissionRate"
                 class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500 transition-colors">
          <p class="text-xs text-gray-500 mt-1">The percentage cut taken from every successful seller order.</p>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Global Tax Rate (%)</label>
          <input type="number" [(ngModel)]="settings.taxRate"
                 class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500 transition-colors">
        </div>
      </div>
    </div>

    <!-- Security & Access Settings -->
    <div class="bg-white/80 backdrop-blur-xl border border-gray-100 rounded-3xl p-8 shadow-sm hover:shadow-md transition-shadow border-l-4 border-l-red-500">
      <h2 class="text-xl font-bold text-gray-900 mb-6 flex items-center">
        <i class="fas fa-shield-alt text-red-500 mr-3"></i> Security & Access
      </h2>
      
      <div class="space-y-4">
        
        <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer hover:bg-gray-100 transition-colors">
          <div>
            <div class="font-bold text-gray-900">Enable New User Registrations</div>
            <div class="text-sm text-gray-500">Allow new customers to sign up for accounts.</div>
          </div>
          <div class="relative inline-block w-12 h-6 rounded-full transition-colors" [ngClass]="settings.enableRegistrations ? 'bg-blue-500' : 'bg-gray-300'">
            <input type="checkbox" [(ngModel)]="settings.enableRegistrations" class="opacity-0 w-0 h-0">
            <span class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform" [ngClass]="settings.enableRegistrations ? 'translate-x-6' : ''"></span>
          </div>
        </label>
        
        <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer hover:bg-gray-100 transition-colors">
          <div>
            <div class="font-bold text-gray-900">Enable New Seller Applications</div>
            <div class="text-sm text-gray-500">Allow users to apply for seller accounts.</div>
          </div>
          <div class="relative inline-block w-12 h-6 rounded-full transition-colors" [ngClass]="settings.enableSellerApplications ? 'bg-blue-500' : 'bg-gray-300'">
            <input type="checkbox" [(ngModel)]="settings.enableSellerApplications" class="opacity-0 w-0 h-0">
            <span class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform" [ngClass]="settings.enableSellerApplications ? 'translate-x-6' : ''"></span>
          </div>
        </label>
        
        <label class="flex items-center justify-between p-4 bg-red-50 rounded-xl border border-red-200 cursor-pointer hover:bg-red-100 transition-colors">
          <div>
            <div class="font-bold text-red-900">Enable Maintenance Mode</div>
            <div class="text-sm text-red-700">Disable frontend access for all non-admin users. Use with caution.</div>
          </div>
          <div class="relative inline-block w-12 h-6 rounded-full transition-colors" [ngClass]="settings.maintenanceMode ? 'bg-red-600' : 'bg-gray-300'">
            <input type="checkbox" [(ngModel)]="settings.maintenanceMode" class="opacity-0 w-0 h-0">
            <span class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform" [ngClass]="settings.maintenanceMode ? 'translate-x-6' : ''"></span>
          </div>
        </label>

      </div>
    </div>
    
  </div>

</div>
