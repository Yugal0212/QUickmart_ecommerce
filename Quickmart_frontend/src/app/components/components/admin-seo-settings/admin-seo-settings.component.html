<div class="p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Global SEO Settings</h1>
    <p class="text-gray-500">Manage global meta tags, search console verification, and canonicals.</p>
  </div>

  <div *ngIf="isLoading" class="flex justify-center p-10">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
  </div>

  <div *ngIf="!isLoading" class="bg-white rounded-lg shadow p-6 max-w-4xl">
    
    <div *ngIf="successMessage" class="mb-4 bg-green-50 text-green-700 p-4 rounded-md">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 bg-red-50 text-red-700 p-4 rounded-md">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="saveSettings()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Global Meta -->
        <div class="space-y-4">
          <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">Home Page Meta</h3>
          
          <div>
            <label class="block text-sm font-medium text-gray-700">Website Title</label>
            <input type="text" [(ngModel)]="settings.title" name="title" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700">Website Description</label>
            <textarea [(ngModel)]="settings.description" name="description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"></textarea>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700">Meta Keywords (Comma separated)</label>
            <input type="text" [(ngModel)]="settings.keywords" name="keywords" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
          </div>
        </div>

        <!-- System Configuration -->
        <div class="space-y-4">
          <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">System Configuration</h3>
          
          <div>
            <label class="block text-sm font-medium text-gray-700">Canonical Base URL</label>
            <input type="text" [(ngModel)]="settings.canonicalUrl" name="canonicalUrl" placeholder="https://qickmartnexa.com" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Website Author</label>
            <input type="text" [(ngModel)]="settings.author" name="author" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Google Search Console Verification ID</label>
            <input type="text" [(ngModel)]="settings.googleSearchConsoleId" name="googleSearchConsoleId" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Google Analytics Tracking ID</label>
            <input type="text" [(ngModel)]="settings.googleAnalyticsId" name="googleAnalyticsId" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
          </div>
        </div>
      </div>

      <div class="mt-8 flex justify-end">
        <button type="submit" [disabled]="isSaving" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 disabled:opacity-50">
          {{ isSaving ? 'Saving...' : 'Save Global SEO Settings' }}
        </button>
      </div>
    </form>
  </div>
</div>
