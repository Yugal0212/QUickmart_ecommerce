<div class="p-6 max-w-5xl mx-auto animate__animated animate__fadeIn">
  
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Marketing Campaigns</h1>
    <p class="text-gray-500 mt-1">Draft and blast promotional emails or push notifications to your users.</p>
  </div>

  <div class="bg-white/80 backdrop-blur-xl border border-gray-100 rounded-3xl p-8 shadow-xl">
    
    <form (ngSubmit)="sendCampaign()" #campaignForm="ngForm" class="space-y-6">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Campaign Name *</label>
          <input type="text" [(ngModel)]="newCampaign.name" name="name" required
                 class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition-colors"
                 placeholder="e.g., Summer Blowout 2024">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Target Audience *</label>
          <select [(ngModel)]="newCampaign.targetAudience" name="targetAudience" required
                  class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition-colors">
            <option value="all_customers">All Customers (Opted-in)</option>
            <option value="inactive_customers">Inactive Customers (30+ Days)</option>
            <option value="all_sellers">All Active Sellers</option>
            <option value="abandoned_cart">Abandoned Cart Users</option>
          </select>
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email Subject Line *</label>
        <input type="text" [(ngModel)]="newCampaign.subject" name="subject" required
               class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition-colors font-semibold"
               placeholder="Don't miss out on these deals! 🚀">
      </div>
      
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">Message Body *</label>
        <textarea [(ngModel)]="newCampaign.message" name="message" required rows="8"
                  class="block w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  placeholder="Hello {{ '{' }}{{ '{' }}user.name{{ '}' }}{{ '}' }},\n\nWe have a special offer for you..."></textarea>
        <p class="text-xs text-gray-500 mt-2">Use {{ '{' }}{{ '{' }}user.name{{ '}' }}{{ '}' }} for dynamic personalization.</p>
      </div>
      
      <div class="pt-4 border-t border-gray-100 flex justify-end gap-4">
        <button type="button" class="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-bold hover:bg-gray-50 transition-colors">
          <i class="far fa-save mr-2"></i> Save Draft
        </button>
        <button type="submit" [disabled]="!campaignForm.valid || isSending" 
                class="px-8 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold hover:from-blue-700 hover:to-indigo-700 disabled:opacity-50 transition-all shadow-lg hover:shadow-xl shadow-blue-500/30 flex items-center">
          <i class="fas fa-paper-plane mr-2" *ngIf="!isSending"></i>
          <i class="fas fa-spinner fa-spin mr-2" *ngIf="isSending"></i>
          {{ isSending ? 'Queuing Delivery...' : 'Blast Campaign' }}
        </button>
      </div>

    </form>
    
  </div>

</div>
