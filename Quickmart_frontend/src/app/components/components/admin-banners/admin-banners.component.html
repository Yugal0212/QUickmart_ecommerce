<div class="p-6 max-w-7xl mx-auto animate__animated animate__fadeIn">
  
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Banner Management</h1>
      <p class="text-gray-500 mt-1">Manage homepage carousel banners and promotional visuals.</p>
    </div>
    
    <button (click)="openCreateModal()" class="bg-gray-900 hover:bg-gray-800 text-white font-semibold py-2.5 px-6 rounded-xl transition-colors shadow-md flex items-center">
      <i class="fas fa-plus mr-2"></i> Add Banner
    </button>
  </div>

  <div *ngIf="isLoading" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div *ngFor="let i of [1,2]" class="h-64 bg-gray-200 rounded-3xl animate-pulse"></div>
  </div>

  <div *ngIf="!isLoading && banners.length === 0" class="bg-white/70 backdrop-blur-lg rounded-3xl shadow-xl border border-gray-200 p-16 text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gray-100 mb-4">
      <i class="fas fa-images text-gray-400 text-3xl"></i>
    </div>
    <h3 class="text-xl font-bold text-gray-900">No Banners Found</h3>
    <p class="mt-2 text-gray-500">Upload your first promotional banner for the homepage.</p>
  </div>

  <div *ngIf="!isLoading && banners.length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Banner Card -->
    <div *ngFor="let banner of banners" class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-lg border border-gray-100 overflow-hidden group hover:shadow-2xl transition-all duration-300 flex flex-col">
      
      <!-- Image Area -->
      <div class="h-48 bg-gray-100 relative overflow-hidden">
        <img loading="lazy" [src]="banner.imageUrl" alt="Banner" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='assets/placeholder-banner.png'">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-900/60 to-transparent"></div>
        <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold shadow-sm backdrop-blur-md"
                [ngClass]="banner.isActive ? 'bg-green-500/80 text-white' : 'bg-red-500/80 text-white'">
            <i class="fas fa-circle text-[8px] mr-1.5"></i> {{ banner.isActive ? 'Active' : 'Hidden' }}
          </span>
          <span class="text-white font-mono text-sm bg-black/50 px-2 py-1 rounded backdrop-blur-md">Order: {{ banner.order }}</span>
        </div>
      </div>
      
      <!-- Details Area -->
      <div class="p-5 flex-1 flex flex-col">
        <h3 class="text-lg font-bold text-gray-900 mb-1 truncate">{{ banner.title }}</h3>
        <a *ngIf="banner.link" [href]="banner.link" target="_blank" class="text-sm text-blue-600 hover:underline mb-4 truncate block"><i class="fas fa-link mr-1"></i> {{ banner.link }}</a>
        <p *ngIf="!banner.link" class="text-sm text-gray-400 mb-4">No link attached</p>
        
        <div class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between">
          <button (click)="toggleBannerStatus(banner)" class="text-sm font-semibold text-gray-600 hover:text-gray-900 transition-colors flex items-center">
            <i class="fas" [ngClass]="banner.isActive ? 'fa-eye-slash mr-1.5' : 'fa-eye mr-1.5'"></i> 
            {{ banner.isActive ? 'Hide on Homepage' : 'Show on Homepage' }}
          </button>
          
          <button (click)="deleteBanner(banner._id)" class="w-8 h-8 rounded-full bg-red-50 hover:bg-red-500 text-red-500 hover:text-white flex items-center justify-center transition-colors">
            <i class="fas fa-trash text-sm"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Create Modal Overlay -->
<div *ngIf="showCreateModal" class="fixed inset-0 z-50 overflow-y-auto">
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
    <div class="fixed inset-0 transition-opacity bg-gray-900/40 backdrop-blur-sm" (click)="closeCreateModal()"></div>
    
    <div class="inline-block w-full max-w-xl p-6 my-8 overflow-hidden text-left align-middle transition-all transform bg-white shadow-2xl rounded-3xl animate__animated animate__zoomIn animate__faster">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-bold text-gray-900">Add New Banner</h3>
        <button (click)="closeCreateModal()" class="text-gray-400 hover:text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-full p-2 transition-colors">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <form (ngSubmit)="saveBanner()" #bannerForm="ngForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Banner Title *</label>
          <input type="text" [(ngModel)]="newBanner.title" name="title" required
                 class="block w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500 transition-colors"
                 placeholder="e.g., Summer Sale 50% Off">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Image URL *</label>
          <input type="url" [(ngModel)]="newBanner.imageUrl" name="imageUrl" required
                 class="block w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500 transition-colors"
                 placeholder="https://example.com/image.jpg">
          <div *ngIf="newBanner.imageUrl" class="mt-2 h-32 rounded-xl overflow-hidden border border-gray-200">
            <img loading="lazy" [src]="newBanner.imageUrl" class="w-full h-full object-cover" onerror="this.src='assets/placeholder-banner.png'">
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Target Link (Optional)</label>
          <input type="url" [(ngModel)]="newBanner.link" name="link"
                 class="block w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500 transition-colors"
                 placeholder="/products?category=summer">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Display Order</label>
          <input type="number" [(ngModel)]="newBanner.order" name="order"
                 class="block w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-green-500 focus:border-green-500 transition-colors"
                 placeholder="0 (Lower shows first)">
        </div>
        
        <div class="pt-4 flex justify-end gap-3">
          <button type="button" (click)="closeCreateModal()" class="px-6 py-2.5 rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition-colors">
            Cancel
          </button>
          <button type="submit" [disabled]="!bannerForm.valid || isSaving" 
                  class="px-6 py-2.5 rounded-xl bg-green-600 text-white font-semibold hover:bg-green-700 disabled:opacity-50 transition-colors shadow-md">
            {{ isSaving ? 'Saving...' : 'Upload Banner' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
