<section id="latest-products" class="products-carousel">

  <div class="container-lg overflow-hidden pb-5">
    <div class="row">
      <div class="col-md-12">
        <div class="section-header d-flex justify-content-between my-4">
          <h2 class="section-title">Just Arrived</h2>
          <div class="d-flex align-items-center">
            <a routerLink="/allproducts" class="btn btn-primary me-2">View All</a>
            <div class="swiper-buttons">
              <button class="swiper-prev products-carousel-prev btn btn-primary">❮</button>
              <button class="swiper-next products-carousel-next btn btn-primary">❯</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="swiper just-arrived-swiper">
          <div class="swiper-wrapper">
            <!-- Skeleton Loader -->
            <ng-container *ngIf="isLoading">
              <div class="col" *ngFor="let item of [].constructor(8)">
                <div class="skeleton-loader">
                  <div class="skeleton-image shimmer"></div>
                  <div class="skeleton-text shimmer"></div>
                  <div class="skeleton-text shimmer"></div>
                  <div class="skeleton-text shimmer"></div>
                </div>
              </div>
            </ng-container>

            <!-- Loop through just arrived products and render each one -->
            <div class="product-item swiper-slide" *ngFor="let product of justArrivedProducts">
              <figure>
                <a [routerLink]="['/productdetails', product._id]" title="Product Title">
                  <img loading="lazy" [src]="product.images[0]" alt="Product Thumbnail" class="tab-image">
                </a>
              </figure>
              <div class="d-flex flex-column text-center">
                <h3 class="fs-6 fw-normal">{{ product.name }}</h3>
                <div>
                  <span class="rating">
                    <span *ngFor="let star of getStars(product.rating)">
                      <svg width="18" height="18" [ngClass]="{'text-warning': star === 'full', 'text-muted': star === 'empty'}">
                        <use [attr.xlink:href]="star === 'full' ? '#star-full' : '#star-empty'"></use>
                      </svg>
                    </span>
                  </span>
                  <span>({{ product.reviewCount }})</span>
                </div>
                <div class="d-flex justify-content-center align-items-center gap-2">
                  <del>₹{{ product.price * 1.2 | number: '1.2-2' }}</del>
                  <span class="text-dark fw-semibold">₹{{ product.price | number: '1.2-2' }}</span>
                  <span class="badge border border-dark-subtle rounded-0 fw-normal px-1 fs-7 lh-1 text-body-tertiary">
                    {{ product.discount }}% OFF
                  </span>
                </div>
                <div class="button-area p-3 pt-0">
                  <div class="row g-1 mt-2">
                    <div class="col-3">
                      <input
                      type="number"
                      name="quantity"
                      class="form-control border-dark-subtle input-number quantity"
                      value="1"
                      #quantityInput
                    />
                  </div>
                  <div class="col-7">
                    <button
                      class="btn btn-primary rounded-1 p-2 fs-7 btn-cart w-100"
                      [disabled]="addingToCart[product._id]"
                      (click)="addToCart(product._id, +quantityInput.value)"
                    >
                      <ng-container *ngIf="!addingToCart[product._id]">
                        <svg width="18" height="18" class="me-1"><use xlink:href="#cart"></use></svg> Add
                      </ng-container>
                      <ng-container *ngIf="addingToCart[product._id]">
                        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                        Adding...
                      </ng-container>
                    </button>
                  </div>
                    <div class="col-2">
                      <a href="#" class="btn btn-outline-dark rounded-1 p-2 fs-6">
                        <svg width="18" height="18"><use xlink:href="#heart"></use></svg>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
