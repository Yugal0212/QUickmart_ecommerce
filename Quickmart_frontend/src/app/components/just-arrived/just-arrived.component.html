<section id="latest-products" class="products-carousel">

  <div class="container-lg overflow-hidden pb-5">
    <div class="row">
      <div class="col-md-12">
        <div class="section-header d-flex justify-content-between my-4">
          <h2 class="section-title">Just Arrived</h2>
          <div class="d-flex align-items-center">
            <a routerLink="/allproducts" class="btn btn-primary me-2">View All</a>
            <div class="swiper-buttons">
              <button class="swiper-prev products-carousel-prev btn btn-primary">❮</button>
              <button class="swiper-next products-carousel-next btn btn-primary">❯</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="swiper just-arrived-swiper">
          <div class="swiper-wrapper">
            <!-- Skeleton Loader -->
            <ng-container *ngIf="isLoading">
              <div class="col" *ngFor="let item of [].constructor(8)">
                <div class="skeleton-loader">
                  <div class="skeleton-image shimmer"></div>
                  <div class="skeleton-text shimmer"></div>
                  <div class="skeleton-text shimmer"></div>
                  <div class="skeleton-text shimmer"></div>
                </div>
              </div>
            </ng-container>

          <!-- Empty State -->
          <div class="w-100 text-center py-5" *ngIf="!isLoading && justArrivedProducts.length === 0">
            <div class="p-5 bg-light rounded-3 border border-dashed">
              <svg width="48" height="48" class="text-muted mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
              </svg>
              <h4 class="text-muted fw-bold">Nothing Just Arrived</h4>
              <p class="text-muted mb-0">No new products have been added recently. Stay tuned!</p>
            </div>
          </div>

          <!-- Swiper Slide for each product -->
          <div class="product-item swiper-slide" *ngFor="let product of justArrivedProducts">
              <figure>
                <a [routerLink]="['/productdetails', product._id]" title="Product Title">
                  <img loading="lazy" [src]="product.images[0]" alt="Product Thumbnail" class="tab-image">
                </a>
              </figure>
              <div class="d-flex flex-column text-center">
                <h3 class="fs-6 fw-normal">{{ product.name }}</h3>
                  <div class="d-flex justify-content-center align-items-center gap-1 mb-2">
                    <span class="rating d-flex text-warning fs-6">
                      <i *ngFor="let star of getStars(product.rating || 0)" 
                         [ngClass]="star === 'full' ? 'fas fa-star' : (star === 'half' ? 'fas fa-star-half-alt' : 'far fa-star text-muted')"></i>
                    </span>
                    <span class="text-muted fs-7">({{ product.reviewCount || 0 }})</span>
                  </div>
                <div class="d-flex justify-content-center align-items-center gap-2">
                  <del>₹{{ product.price * 1.2 | number: '1.2-2' }}</del>
                  <span class="text-dark fw-semibold">₹{{ product.price | number: '1.2-2' }}</span>
                  <span class="badge border border-dark-subtle rounded-0 fw-normal px-1 fs-7 lh-1 text-body-tertiary">
                    {{ product.discount }}% OFF
                  </span>
                </div>
                <div class="button-area p-3 pt-0">
                  <div class="d-flex justify-content-between align-items-center gap-2 mt-3">
                    <input
                      type="number"
                      name="quantity"
                      class="form-control border-dark-subtle input-number text-center"
                      style="width: 60px;"
                      value="1"
                      min="1"
                      #quantityInput
                    />
                    <button
                      class="btn btn-primary rounded-1 flex-grow-1 d-flex justify-content-center align-items-center px-2 py-2 fs-7"
                      [disabled]="addingToCart[product._id]"
                      (click)="addToCart(product._id, +quantityInput.value)"
                    >
                      <ng-container *ngIf="!addingToCart[product._id]">
                        <i class="fas fa-shopping-cart me-2"></i> Add
                      </ng-container>
                      <ng-container *ngIf="addingToCart[product._id]">
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                      </ng-container>
                    </button>
                    <a href="#" class="btn btn-outline-dark rounded-1 d-flex justify-content-center align-items-center px-3 py-2" (click)="$event.preventDefault()">
                      <i class="far fa-heart"></i>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
