<div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shadow-sm hidden md:flex transition-all duration-300 z-10">
      <div class="h-16 flex items-center justify-center border-b border-gray-100">
        <h2 class="text-xl font-bold text-gray-800 tracking-tight">Admin <span class="text-green-600">Portal</span></h2>
      </div>
      
      <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
        <a routerLink="/admin-dashboard/overview" routerLinkActive="bg-green-50 text-green-700 font-semibold" 
           class="flex items-center gap-3 px-4 py-3 text-gray-600 rounded-xl hover:bg-gray-50 hover:text-green-600 transition-colors group">
          <i class="fas fa-chart-line text-lg group-hover:scale-110 transition-transform"></i>
          <span>Overview</span>
        </a>
        
        <a routerLink="/admin-dashboard/Users-manage" routerLinkActive="bg-green-50 text-green-700 font-semibold" 
           class="flex items-center gap-3 px-4 py-3 text-gray-600 rounded-xl hover:bg-gray-50 hover:text-green-600 transition-colors group">
          <i class="fas fa-users text-lg group-hover:scale-110 transition-transform"></i>
          <span>Users</span>
        </a>
            
        <a routerLink="/admin-dashboard/products" routerLinkActive="bg-green-50 text-green-700 font-semibold" 
           class="flex items-center gap-3 px-4 py-3 text-gray-600 rounded-xl hover:bg-gray-50 hover:text-green-600 transition-colors group">
          <i class="fas fa-box text-lg group-hover:scale-110 transition-transform"></i>
          <span>All Products</span>
        </a>
        
        <a routerLink="/admin-dashboard/seller-requests" routerLinkActive="bg-green-50 text-green-700 font-semibold" 
           class="flex items-center gap-3 px-4 py-3 text-gray-600 rounded-xl hover:bg-gray-50 hover:text-green-600 transition-colors group">
          <i class="fas fa-store-alt text-lg group-hover:scale-110 transition-transform"></i>
          <span>Seller Requests</span>
        </a>
  
        <a routerLink="/admin-dashboard/categories" routerLinkActive="bg-green-50 text-green-700 font-semibold" 
           class="flex items-center gap-3 px-4 py-3 text-gray-600 rounded-xl hover:bg-gray-50 hover:text-green-600 transition-colors group">
          <i class="fas fa-list text-lg group-hover:scale-110 transition-transform"></i>
          <span>All Categories</span>
        </a>
  
        <a routerLink="/admin-dashboard/add-category" routerLinkActive="bg-green-50 text-green-700 font-semibold" 
           class="flex items-center gap-3 px-4 py-3 text-gray-600 rounded-xl hover:bg-gray-50 hover:text-green-600 transition-colors group">
          <i class="fas fa-plus-square text-lg group-hover:scale-110 transition-transform"></i>
          <span>Add Category</span>
        </a>
      </nav>
    </aside>
  
    <!-- Main Content Wrapper -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
      
      <!-- Top Header -->
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 lg:px-10 shadow-sm shrink-0 z-10">
        <div class="flex items-center gap-4">
          <h3 class="text-xl font-bold text-gray-800 m-0">Workspace</h3>
        </div>
        
        <div class="flex items-center gap-6">
          <div class="flex flex-col items-end hidden sm:flex">
            <span class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Welcome back</span>
            <span class="text-sm font-bold text-gray-800">{{ username }}</span>
          </div>
          <div class="h-8 w-px bg-gray-200 hidden sm:block"></div>
          <button (click)="logout()" class="flex items-center gap-2 bg-red-50 text-red-600 hover:bg-red-500 hover:text-white px-5 py-2 rounded-full font-medium transition-all duration-300 shadow-sm hover:shadow-md border border-red-100 hover:border-red-500">
            <i class="fas fa-sign-out-alt"></i> 
            <span>Logout</span>
          </button>
        </div>
      </header>
      
      <!-- Dynamic Content Area -->
      <div class="flex-1 p-6 lg:p-10 overflow-y-auto">
        <router-outlet></router-outlet>
      </div>
      
    </main>
  </div>
